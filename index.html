<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply a saved choice, or the system preference, before the first paint.
      // Mirrors STORAGE_KEY, THEMES and resolveTheme in src/lib/theme.svelte.js.
      let savedTheme;
      try {
        savedTheme = localStorage.getItem('theme');
      } catch {}
      document.documentElement.dataset.theme =
        savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tony Mastromarino — projects on GitHub, résumé, and contact."
    />

    <meta property="og:description" content="Projects on GitHub, résumé, and contact." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Forum&amp;display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto&amp;display=swap" />
